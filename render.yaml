services:
  - type: web
    name: elitecv-pro
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build && ls -la dist/
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
